<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAFA" />
  <meta name="description" content="A pocket of St. Petersburg and Sarasota. Pick a mood, get directions, wander." />
  <title>City Day</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --ink: #2A2A2A;
      --cyan: #46C1D1;
      --peach: #F5A791;
      --red: #EE3124;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.45;
      padding: 1.5rem 1.35rem 3rem;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 26rem; margin: 0 auto; }
    h1 {
      font-size: clamp(2.15rem, 9vw, 2.85rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.05;
      margin: 0 0 1.75rem;
    }
    h1::after {
      content: "";
      display: block;
      width: 2.25rem;
      height: 3px;
      margin-top: 1.05rem;
      border-radius: 99px;
      background: var(--peach);
    }
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0 0 0.35rem;
    }
    p { margin: 0; }
    .city {
      width: 100%;
      height: auto;
      display: block;
      margin: 0.25rem 0 0.5rem;
    }
    .lede {
      margin: -0.35rem 0 0;
      max-width: 16rem;
    }
    .why { margin: 0 0 0.45rem; }
    .meta {
      opacity: 0.62;
      font-size: 0.92rem;
      margin: 0 0 0.2rem;
    }
    .note {
      margin: -0.85rem 0 1.35rem;
      max-width: 18rem;
    }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 1rem 1.2rem;
      font: inherit;
      font-weight: 650;
      font-size: 1rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }
    .btn-primary { background: var(--red); color: var(--bg); }
    .btn-ink { background: var(--ink); color: var(--bg); }
    .group { margin: 0 0 1.25rem; }
    .group p {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.62;
      margin: 0 0 0.5rem;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .pills button {
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .pills button[aria-pressed="true"] {
      background: var(--cyan);
      border-color: var(--cyan);
    }
    .moods { display: grid; gap: 0.7rem; }
    .moods button {
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ink);
      border-radius: 1.05rem;
      padding: 1.05rem 1.15rem;
      font: inherit;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .moods button:active { background: rgba(70, 193, 209, 0.16); }
    .stop {
      padding: 0 0 1.35rem;
      margin: 0 0 1.35rem;
      border-bottom: 1px solid rgba(42, 42, 42, 0.12);
    }
    .stop .btn { margin-top: 0.95rem; }
    .skip, .quiet {
      background: none;
      border: none;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      padding: 0;
    }
    .skip {
      display: block;
      margin: 0.85rem auto 0;
      opacity: 0.55;
      font-size: 0.92rem;
      text-decoration: underline;
      text-underline-offset: 0.22em;
    }
    .quiet {
      display: inline-block;
      opacity: 0.5;
      font-size: 0.95rem;
      text-decoration: underline;
      text-underline-offset: 0.25em;
    }
    .escapes {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
    }
    .solo-quiet { display: block; margin: 2rem auto 0; }
    #screen-door {
      min-height: calc(100svh - 4.5rem);
      display: flex;
      flex-direction: column;
    }
    #screen-door h1 { margin: auto 0 0.75rem; }
    #screen-door .btn { margin-top: 1.75rem; }
    #screen-curate .btn { margin-top: 0.6rem; }
    .hidden { display: none !important; }
    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section id="screen-door">
      <svg class="city" viewBox="0 0 360 170" fill="none" role="img" aria-label="St. Pete, sun over a low skyline and the water">
        <circle cx="292" cy="40" r="14" fill="#F5A791"/>
        <path d="M292 16v8M292 56v8M268 40h8M308 40h8M274 22l6 6M304 52l6 6M274 58l6-6M304 28l6-6" stroke="#F5A791" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 128V96h22V78h16v26h24V70h18v22h24V60h18v50h30V84h20v44" stroke="#2A2A2A" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M196 128h144" stroke="#2A2A2A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M292 128V104h42v24" stroke="#46C1D1" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M313 104V92" stroke="#46C1D1" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M0 140c50-10 80 10 130 0s80 10 130 0 70 6 100-2V170H0Z" fill="#46C1D1"/>
        <path d="M0 154c46-6 78 6 130 0s84 6 136 0 70 2 94-2" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>St. Pete, for a day.</h1>
      <p class="lede">A pocket to wander, not a schedule.</p>
      <button type="button" class="btn btn-primary" id="begin">Start the day</button>
      <a class="quiet solo-quiet" href="https://jakeand3rson.github.io/city-day-test/">Make a day</a>
    </section>

    <section id="screen-curate" class="hidden">
      <h1>Shape it a little.</h1>
      <div class="group" data-group="feel">
        <p>How the day feels</p>
        <div class="pills">
          <button type="button" data-value="mystery" aria-pressed="false">Mystery</button>
          <button type="button" data-value="plan" aria-pressed="false">Just the plan</button>
        </div>
      </div>
      <div class="group" data-group="drink">
        <p>Drinking</p>
        <div class="pills">
          <button type="button" data-value="yes" aria-pressed="false">Yes</button>
          <button type="button" data-value="no" aria-pressed="false">No</button>
          <button type="button" data-value="either" aria-pressed="false">Doesn't matter</button>
        </div>
      </div>
      <div class="group" data-group="lean">
        <p>What to lean toward</p>
        <div class="pills">
          <button type="button" data-value="must" aria-pressed="false">Must-sees</button>
          <button type="button" data-value="gems" aria-pressed="false">Hidden gems</button>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="build" disabled>Build my day</button>
    </section>

    <section id="screen-moods" class="hidden">
      <h1>What’s calling?</h1>
      <p class="note hidden" id="mood-drink"></p>
      <div class="moods" id="mood-list">
        <button type="button" data-mood="morning">A slow morning</button>
        <button type="button" data-mood="dig">Something to dig through</button>
        <button type="button" data-mood="sweet">Something sweet</button>
      </div>
      <div class="escapes">
        <button type="button" class="quiet" id="show-list">Just show me</button>
        <button type="button" class="quiet" id="mood-back">Change the day</button>
      </div>
    </section>

    <section id="screen-pocket" class="hidden">
      <h1 id="pocket-title"></h1>
      <p class="note hidden" id="pocket-note"></p>
      <div id="pocket-stops"></div>
      <button type="button" class="quiet solo-quiet" id="back-moods">A different mood</button>
    </section>

    <section id="screen-list" class="hidden">
      <h1>Around today</h1>
      <p class="note hidden" id="list-note"></p>
      <div id="list-stops"></div>
      <button type="button" class="quiet solo-quiet" id="list-back">Back</button>
    </section>
  </div>

  <script>
    var PLACES = {
      market: {
        name: "Saturday Morning Market",
        why: "Stalls, music, and a slow start to the day.",
        hours: "Sat 9am–2pm",
        address: "100 1st Ave SE, St. Petersburg",
        query: "Saturday Morning Market, 100 1st Ave SE, St. Petersburg"
      },
      artpool: {
        name: "ARTpool",
        why: "Vintage clothing and records.",
        hours: "Sat 12–5",
        address: "2030 Central Ave, St. Petersburg",
        also: "Also 2000 Central Ave.",
        query: "ARTpool, 2030 Central Ave, St. Petersburg"
      },
      ofkors: {
        name: "ofKors Bakery",
        why: "Crepes and pastry.",
        hours: "Sat until 10pm",
        address: "1359 Main St, Sarasota",
        query: "ofKors Bakery, 1359 Main St, Sarasota"
      },
      fresco: {
        name: "Fresco Gelato and Coffee",
        why: "Gelato and coffee.",
        hours: "Until 10pm",
        address: "1536 Main St, Sarasota",
        query: "Fresco Gelato and Coffee, 1536 Main St, Sarasota"
      },
      gelatogo: {
        name: "Gelato-go",
        why: "Italian gelato.",
        hours: "Until 9:30pm",
        address: "14 S Orange Ave, Sarasota",
        query: "Gelato-go, 14 S Orange Ave, Sarasota"
      }
    };

    var MOODS = {
      morning: { title: "A slow morning", ids: ["market"], note: "" },
      dig: { title: "Something to dig through", ids: ["artpool"], note: "" },
      sweet: {
        title: "Something sweet",
        ids: ["ofkors", "fresco", "gelatogo"],
        note: "A short drive from downtown St. Pete."
      }
    };

    var HIDE_KEY = "city-day-hidden";
    var CHOICE_KEY = "city-day-choices";
    var screen = "door";
    var moodId = null;
    var listReturn = "moods";

    function hiddenIds() {
      try {
        var raw = JSON.parse(sessionStorage.getItem(HIDE_KEY) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch (e) {
        return [];
      }
    }

    function hideId(id) {
      var ids = hiddenIds();
      if (ids.indexOf(id) === -1) ids.push(id);
      sessionStorage.setItem(HIDE_KEY, JSON.stringify(ids));
    }

    function visible(ids) {
      var hidden = hiddenIds();
      return ids.filter(function (id) { return hidden.indexOf(id) === -1; });
    }

    function loadChoices() {
      try {
        var raw = JSON.parse(sessionStorage.getItem(CHOICE_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch (e) {
        return {};
      }
    }

    function saveChoices(c) {
      sessionStorage.setItem(CHOICE_KEY, JSON.stringify(c));
    }

    function readPills() {
      var c = {};
      document.querySelectorAll(".group").forEach(function (g) {
        var on = g.querySelector('[aria-pressed="true"]');
        if (on) c[g.getAttribute("data-group")] = on.getAttribute("data-value");
      });
      return c;
    }

    function applyPills(c) {
      document.querySelectorAll(".group").forEach(function (g) {
        var key = g.getAttribute("data-group");
        g.querySelectorAll("[data-value]").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-value") === c[key] ? "true" : "false");
        });
      });
      document.getElementById("build").disabled = !(c.feel && c.drink && c.lean);
    }

    function drinkLine() {
      return loadChoices().drink === "no" ? "No drinks on this one." : "";
    }

    function leanLine() {
      return loadChoices().lean === "gems"
        ? "ARTpool first, then the market."
        : "The market first.";
    }

    function moodOrder() {
      return loadChoices().lean === "gems"
        ? ["dig", "morning", "sweet"]
        : ["morning", "dig", "sweet"];
    }

    function dayOrder() {
      var head = loadChoices().lean === "gems"
        ? ["artpool", "market"]
        : ["market", "artpool"];
      return head.concat(["ofkors", "fresco", "gelatogo"]);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function mapsUrl(query) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
    }

    function stopHtml(id, primary) {
      var p = PLACES[id];
      var go = primary ? "btn btn-primary" : "btn btn-ink";
      return (
        '<article class="stop">' +
          "<h2>" + esc(p.name) + "</h2>" +
          '<p class="why">' + esc(p.why) + "</p>" +
          '<p class="meta">' + esc(p.hours) + "</p>" +
          '<p class="meta">' + esc(p.address) + "</p>" +
          (p.also ? '<p class="meta">' + esc(p.also) + "</p>" : "") +
          '<a class="' + go + '" href="' + esc(mapsUrl(p.query)) + '" target="_blank" rel="noopener">Get directions</a>' +
          '<button type="button" class="skip" data-skip="' + esc(id) + '">Not for us</button>' +
        "</article>"
      );
    }

    function stopsHtml(ids) {
      if (!ids.length) {
        return '<p class="why">Nothing left in this pocket.</p>';
      }
      var primary = ids.length === 1;
      return ids.map(function (id) { return stopHtml(id, primary); }).join("");
    }

    function setNote(el, text) {
      if (text) {
        el.textContent = text;
        el.classList.remove("hidden");
      } else {
        el.textContent = "";
        el.classList.add("hidden");
      }
    }

    function show(name) {
      screen = name;
      ["door", "curate", "moods", "pocket", "list"].forEach(function (s) {
        document.getElementById("screen-" + s).classList.toggle("hidden", s !== name);
      });
      window.scrollTo(0, 0);
    }

    function renderMoods() {
      var box = document.getElementById("mood-list");
      moodOrder().forEach(function (id) {
        var btn = box.querySelector('[data-mood="' + id + '"]');
        if (btn) box.appendChild(btn);
      });
      setNote(document.getElementById("mood-drink"), drinkLine());
    }

    function renderPocket() {
      var mood = MOODS[moodId];
      var ids = visible(mood.ids);
      document.getElementById("pocket-title").textContent = mood.title;
      var bits = [];
      if (mood.note && ids.length) bits.push(mood.note);
      if (ids.length && drinkLine()) bits.push(drinkLine());
      setNote(document.getElementById("pocket-note"), bits.join(" "));
      document.getElementById("pocket-stops").innerHTML = stopsHtml(ids);
    }

    function renderList() {
      var ids = visible(dayOrder());
      var bits = [];
      if (ids.length) bits.push(leanLine());
      if (drinkLine()) bits.push(drinkLine());
      setNote(document.getElementById("list-note"), bits.join(" "));
      document.getElementById("list-stops").innerHTML = ids.length
        ? stopsHtml(ids)
        : '<p class="why">That’s everything we had.</p>';
    }

    function render() {
      if (screen === "moods") renderMoods();
      if (screen === "pocket") renderPocket();
      if (screen === "list") renderList();
    }

    document.getElementById("begin").addEventListener("click", function () {
      applyPills(loadChoices());
      show("curate");
    });

    document.querySelectorAll(".pills button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.parentNode.querySelectorAll("[data-value]").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        var c = readPills();
        saveChoices(c);
        document.getElementById("build").disabled = !(c.feel && c.drink && c.lean);
      });
    });

    document.getElementById("build").addEventListener("click", function () {
      var c = readPills();
      if (!(c.feel && c.drink && c.lean)) return;
      saveChoices(c);
      if (c.feel === "plan") {
        listReturn = "curate";
        renderList();
        show("list");
      } else {
        renderMoods();
        show("moods");
      }
    });

    document.querySelectorAll("[data-mood]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        moodId = btn.getAttribute("data-mood");
        renderPocket();
        show("pocket");
      });
    });

    document.getElementById("show-list").addEventListener("click", function () {
      listReturn = "moods";
      renderList();
      show("list");
    });

    document.getElementById("mood-back").addEventListener("click", function () {
      applyPills(loadChoices());
      show("curate");
    });

    document.getElementById("back-moods").addEventListener("click", function () {
      renderMoods();
      show("moods");
    });

    document.getElementById("list-back").addEventListener("click", function () {
      if (listReturn === "curate") applyPills(loadChoices());
      else renderMoods();
      show(listReturn);
    });

    document.body.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-skip]");
      if (!btn) return;
      hideId(btn.getAttribute("data-skip"));
      render();
    });
  </script>
</body>
</html>
